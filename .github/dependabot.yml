version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:15"
    open-pull-requests-limit: 20
    # Grouped by the thing being upgraded rather than left one pull request per artifact.
    # Families that share a release train produce one reviewable diff instead of four that
    # each rebase the others, and the first group below is load-bearing: docker-java-api is
    # pinned by hand in the pom because testcontainers-bom does not manage it, so it has to
    # move in the same pull request as testcontainers or the pin goes stale.
    groups:
      testcontainers:
        patterns:
          - "org.testcontainers:*"
          - "com.github.docker-java:*"
      junit:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:16"
    groups:
      github-actions:
        patterns:
          - "*"
