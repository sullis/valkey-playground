version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:15"
    open-pull-requests-limit: 20
    # Grouped by the thing being upgraded rather than left one pull request per artifact.
    # Families that share a release train produce one reviewable diff instead of four that
    # each rebase the others.
    groups:
      testcontainers:
        patterns:
          - "org.testcontainers:*"
      junit:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:16"
    groups:
      github-actions:
        patterns:
          - "*"
