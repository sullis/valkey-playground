name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        java: [ 17, 21 ]
        os: [ 'ubuntu-latest' ]
    runs-on: ${{ matrix.os }}
    name: Java ${{ matrix.java }} ${{ matrix.os }}
    # The suite runs in well under a minute. This is a bound on a build that has stopped making
    # progress at all -- a docker pull or a testcontainers wait that never returns -- which
    # would otherwise hold a runner for the six hour default.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'
    - name: Build
      run: mvn -ntp -B clean test
